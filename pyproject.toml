[project]
name = "batchwatch"
version = "0.3.0"
description = "Batch fermentation monitoring across manufacturing sites"
requires-python = ">=3.11"
dependencies = [
    "neomodel>=5.4,<6",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "graph: test needs a running Neo4j with seed data",
]
